name: Dashboard regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend session and money regressions
        run: node --test frontend/tests/*.test.mjs
      - name: Build and start the supplied application
        run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/up; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Run authentication, service, and real database regressions
        run: docker compose exec -T backend env RUN_INTEGRATION_TESTS=1 python -m unittest discover -s tests -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop the test stack
        if: always()
        run: docker compose down -v
